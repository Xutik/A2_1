<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List October 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>My ToDo</h1>
        <div class="stats">
            <span id="completed-count"></span>
        </div>
        <div class="add-todo-section">
            <input type="text" id="todo-input" required>
            <button id="add-todo-btn">OK</button>
            <p id="error-message" class="error-message"></p>
        </div>
        <ul id="todos-list">
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
